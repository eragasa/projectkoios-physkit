[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projectkoios-physkit"
version = "0.1.3.dev0"
description = "Reusable computational-physics models and numerical methods for Project Koios"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  {name = "Eugene Joseph M. Ragasa", email = "eugene@projectkoios.com"}
]

dependencies = [
  "numpy>=1.26",
  "pandas",
  "scipy>=1.10",
  "matplotlib>=3.8",
  "pint>=0.26,<0.27",
  "projectkoios-optimization[numpy] @ git+https://github.com/eragasa/projectkoios-optimization.git@f6bdecc418e46240087d1dfb1c22dac396cdc455",
  "sympy>=1.12"
]

[project.urls]
Repository = "https://github.com/eragasa/projectkoios-physkit"
Documentation = "https://github.com/eragasa/projectkoios-physkit/tree/main/docs"

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "pytest>=8.0",
  "pytest-cov>=4.0",
  "ruff>=0.16,<1"
]

[tool.setuptools]
package-dir = { "" = "src/python" }

[tool.setuptools.packages.find]
where = ["src/python"]
include = [
  "projectkoios.physkit",
  "projectkoios.physkit.*"
]
namespaces = true

[tool.setuptools.package-data]
"projectkoios.physkit" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/python"]
markers = [
  "unit: fast, isolated tests",
  "integration: crosses module boundaries",
  "slow: long-running tests",
  "deprecated: tests retained only for deprecated legacy code"
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["projectkoios", "tests"]

